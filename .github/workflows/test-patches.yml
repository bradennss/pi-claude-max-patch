name: Test Patches Against Latest Pi

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  test-patches:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install latest Pi and apply patches
        shell: bash
        run: |
          npm install -g @earendil-works/pi-coding-agent@latest
          ./apply.sh -y
